name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create or update (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Determine tag
        id: meta
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          VERSION="$(tr -d '[:space:]' < VERSION)"
          DMG_NAME="Glassforce-${VERSION}.dmg"
          DMG_URL="https://srikolagani.github.io/glassforce-public/releases/${DMG_NAME}"
          NOTES="Install with Homebrew:\n\`\`\`sh\nbrew tap srikolagani/tap https://github.com/srikolagani/glassforce-public.git\nbrew install --cask srikolagani/tap/glassforce\n\`\`\`\n\nOr download the DMG directly: [${DMG_NAME}](${DMG_URL})"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Glassforce ${TAG}" --notes "$(printf "$NOTES")"
          else
            gh release edit "$TAG" --title "Glassforce ${TAG}" --notes "$(printf "$NOTES")"
          fi
          if curl -fsSL "$DMG_URL" -o "$DMG_NAME"; then
            gh release upload "$TAG" "$DMG_NAME" --clobber
          fi
